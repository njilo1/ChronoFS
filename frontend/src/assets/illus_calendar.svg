<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 280" fill="none">
  <!-- Corps du calendrier -->
  <rect x="10" y="40" width="220" height="220" rx="16" fill="white" fill-opacity="0.07" stroke="white" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- En-tête calendrier -->
  <rect x="10" y="40" width="220" height="52" rx="14" fill="white" fill-opacity="0.12"/>
  <rect x="10" y="78" width="220" height="14" fill="white" fill-opacity="0.03"/>

  <!-- Crochets de reliure -->
  <rect x="68"  y="28" width="14" height="28" rx="7" fill="white" fill-opacity="0.3"/>
  <rect x="158" y="28" width="14" height="28" rx="7" fill="white" fill-opacity="0.3"/>

  <!-- Mois -->
  <text x="120" y="62" fill="white" fill-opacity="0.9" font-size="14" font-family="sans-serif" text-anchor="middle" font-weight="700" letter-spacing="1">MAI 2026</text>
  <text x="120" y="76" fill="white" fill-opacity="0.45" font-size="8" font-family="sans-serif" text-anchor="middle" letter-spacing="2">SEMESTRE 1</text>

  <!-- Jours de la semaine -->
  <text x="38"  y="106" fill="white" fill-opacity="0.5" font-size="8.5" font-family="sans-serif" text-anchor="middle" font-weight="600">L</text>
  <text x="69"  y="106" fill="white" fill-opacity="0.5" font-size="8.5" font-family="sans-serif" text-anchor="middle" font-weight="600">M</text>
  <text x="100" y="106" fill="white" fill-opacity="0.5" font-size="8.5" font-family="sans-serif" text-anchor="middle" font-weight="600">M</text>
  <text x="131" y="106" fill="white" fill-opacity="0.5" font-size="8.5" font-family="sans-serif" text-anchor="middle" font-weight="600">J</text>
  <text x="162" y="106" fill="white" fill-opacity="0.5" font-size="8.5" font-family="sans-serif" text-anchor="middle" font-weight="600">V</text>
  <text x="193" y="106" fill="white" fill-opacity="0.5" font-size="8.5" font-family="sans-serif" text-anchor="middle" font-weight="600">S</text>
  <text x="222" y="106" fill="white" fill-opacity="0.3" font-size="8.5" font-family="sans-serif" text-anchor="middle" font-weight="600">D</text>

  <!-- Ligne séparatrice -->
  <line x1="22" y1="112" x2="228" y2="112" stroke="white" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Semaine 1 -->
  <text x="38"  y="132" fill="white" fill-opacity="0.6" font-size="10" font-family="sans-serif" text-anchor="middle">4</text>
  <text x="69"  y="132" fill="white" fill-opacity="0.6" font-size="10" font-family="sans-serif" text-anchor="middle">5</text>
  <text x="100" y="132" fill="white" fill-opacity="0.6" font-size="10" font-family="sans-serif" text-anchor="middle">6</text>
  <text x="131" y="132" fill="white" fill-opacity="0.6" font-size="10" font-family="sans-serif" text-anchor="middle">7</text>
  <text x="162" y="132" fill="white" fill-opacity="0.6" font-size="10" font-family="sans-serif" text-anchor="middle">8</text>
  <text x="193" y="132" fill="white" fill-opacity="0.4" font-size="10" font-family="sans-serif" text-anchor="middle">9</text>
  <text x="222" y="132" fill="white" fill-opacity="0.25" font-size="10" font-family="sans-serif" text-anchor="middle">10</text>

  <!-- Semaine 2 -->
  <text x="38"  y="158" fill="white" fill-opacity="0.6" font-size="10" font-family="sans-serif" text-anchor="middle">11</text>
  <text x="69"  y="158" fill="white" fill-opacity="0.6" font-size="10" font-family="sans-serif" text-anchor="middle">12</text>
  <text x="100" y="158" fill="white" fill-opacity="0.6" font-size="10" font-family="sans-serif" text-anchor="middle">13</text>
  <text x="131" y="158" fill="white" fill-opacity="0.6" font-size="10" font-family="sans-serif" text-anchor="middle">14</text>
  <text x="162" y="158" fill="white" fill-opacity="0.6" font-size="10" font-family="sans-serif" text-anchor="middle">15</text>
  <text x="193" y="158" fill="white" fill-opacity="0.4" font-size="10" font-family="sans-serif" text-anchor="middle">16</text>
  <text x="222" y="158" fill="white" fill-opacity="0.25" font-size="10" font-family="sans-serif" text-anchor="middle">17</text>

  <!-- Semaine 3 — date 25 en surbrillance -->
  <text x="38"  y="184" fill="white" fill-opacity="0.6" font-size="10" font-family="sans-serif" text-anchor="middle">18</text>
  <text x="69"  y="184" fill="white" fill-opacity="0.6" font-size="10" font-family="sans-serif" text-anchor="middle">19</text>
  <text x="100" y="184" fill="white" fill-opacity="0.6" font-size="10" font-family="sans-serif" text-anchor="middle">20</text>
  <text x="131" y="184" fill="white" fill-opacity="0.6" font-size="10" font-family="sans-serif" text-anchor="middle">21</text>
  <text x="162" y="184" fill="white" fill-opacity="0.6" font-size="10" font-family="sans-serif" text-anchor="middle">22</text>
  <text x="193" y="184" fill="white" fill-opacity="0.4" font-size="10" font-family="sans-serif" text-anchor="middle">23</text>
  <text x="222" y="184" fill="white" fill-opacity="0.25" font-size="10" font-family="sans-serif" text-anchor="middle">24</text>

  <!-- Semaine 4 — 25 surligné (aujourd'hui) -->
  <circle cx="38" cy="207" r="12" fill="white" fill-opacity="0.2"/>
  <text x="38"  y="211" fill="white" fill-opacity="1" font-size="10" font-family="sans-serif" text-anchor="middle" font-weight="700">25</text>
  <!-- Marqueurs de cours sur 25 -->
  <circle cx="28" cy="219" r="2.5" fill="#06B6D4" fill-opacity="0.8"/>
  <circle cx="35" cy="219" r="2.5" fill="white" fill-opacity="0.5"/>
  <circle cx="42" cy="219" r="2.5" fill="white" fill-opacity="0.5"/>

  <text x="69"  y="211" fill="white" fill-opacity="0.6" font-size="10" font-family="sans-serif" text-anchor="middle">26</text>
  <text x="100" y="211" fill="white" fill-opacity="0.6" font-size="10" font-family="sans-serif" text-anchor="middle">27</text>
  <text x="131" y="211" fill="white" fill-opacity="0.6" font-size="10" font-family="sans-serif" text-anchor="middle">28</text>
  <text x="162" y="211" fill="white" fill-opacity="0.6" font-size="10" font-family="sans-serif" text-anchor="middle">29</text>
  <text x="193" y="211" fill="white" fill-opacity="0.4" font-size="10" font-family="sans-serif" text-anchor="middle">30</text>
  <text x="222" y="211" fill="white" fill-opacity="0.25" font-size="10" font-family="sans-serif" text-anchor="middle">31</text>

  <!-- Horloge superposée (coin bas-droit) -->
  <circle cx="200" cy="232" r="34" fill="#1E3A8A" fill-opacity="0.7" stroke="white" stroke-opacity="0.25" stroke-width="1.5"/>
  <circle cx="200" cy="232" r="29" fill="none" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
  <!-- Ticks heures -->
  <line x1="200" y1="205" x2="200" y2="210" stroke="white" stroke-opacity="0.5" stroke-width="1.5"/>
  <line x1="227" y1="232" x2="222" y2="232" stroke="white" stroke-opacity="0.5" stroke-width="1.5"/>
  <line x1="200" y1="259" x2="200" y2="254" stroke="white" stroke-opacity="0.5" stroke-width="1.5"/>
  <line x1="173" y1="232" x2="178" y2="232" stroke="white" stroke-opacity="0.5" stroke-width="1.5"/>
  <!-- Aiguille des heures (10h) -->
  <line x1="200" y1="232" x2="191" y2="219" stroke="white" stroke-opacity="0.9" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Aiguille des minutes (02) -->
  <line x1="200" y1="232" x2="209" y2="210" stroke="white" stroke-opacity="0.9" stroke-width="2" stroke-linecap="round"/>
  <!-- Centre horloge -->
  <circle cx="200" cy="232" r="3" fill="white" fill-opacity="0.9"/>
  <!-- Aiguille secondes -->
  <line x1="200" y1="232" x2="186" y2="228" stroke="#06B6D4" stroke-opacity="0.9" stroke-width="1.2" stroke-linecap="round"/>
</svg>

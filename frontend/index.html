<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>ChronoFS — FS-UEB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      // Anti-FOUC : applique le thème AVANT le rendu React.
      (function () {
        try {
          var raw = localStorage.getItem('fschrono-theme');
          var theme = raw ? JSON.parse(raw)?.state?.theme : null;
          // Mode clair par défaut au premier lancement : on n'interroge PAS
          // prefers-color-scheme, sinon un OS en thème sombre ouvrirait l'app
          // en sombre sans choix explicite. Doit rester ALIGNÉ sur le défaut
          // de themeStore.js ('light') pour éviter toute divergence
          // classe `.dark` (DOM) ↔ état du store (textes illisibles).
          if (theme !== 'dark' && theme !== 'light') theme = 'light';
          if (theme === 'dark') document.documentElement.classList.add('dark');
          else                  document.documentElement.classList.remove('dark');
          // Pose color-scheme AVANT le rendu : contrôles natifs et auto-dark
          // de Chrome alignés dès la première peinture (pas de flash/divergence).
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
